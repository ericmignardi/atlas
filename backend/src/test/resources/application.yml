# Test-only overrides. The main configuration deliberately gives atlas.jwt.secret
# no default so a missing secret fails startup (NFR-2.2) — which would also make
# `./mvnw test` fail on a clean machine and in CI. A fixed, obviously-fake value
# here keeps the test run self-contained without weakening the production rule.
atlas:
  jwt:
    secret: test-only-signing-key-not-used-outside-the-test-suite

# Testcontainers supplies the datasource through @ServiceConnection, so the
# Docker Postgres on 5433 is never touched by a test run.
