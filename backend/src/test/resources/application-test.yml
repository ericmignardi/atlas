# Overrides for the `test` profile, layered ON TOP of the real application.yml.
#
# The filename matters. As plain `application.yml` this file sat earlier on the
# classpath than the one in src/main/resources and replaced it outright, so the
# test suite ran against Spring Boot defaults rather than against the
# application's own configuration — no `ddl-auto: validate`, no `open-in-view:
# false`, none of the settings the tests exist to keep honest. Profile-specific
# means additive, which is what was intended.
#
# The main configuration deliberately gives atlas.jwt.secret no default so a
# missing secret fails startup (NFR-2.2) — which would also make `./mvnw test`
# fail on a clean machine and in CI. A fixed, obviously-fake value here keeps the
# test run self-contained without weakening the production rule.
atlas:
  jwt:
    secret: test-only-signing-key-not-used-outside-the-test-suite

# Testcontainers supplies the datasource through @ServiceConnection, so the
# Docker Postgres on 5433 is never touched by a test run.
