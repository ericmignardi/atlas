server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable; index.html must never be cached or a deploy
  # leaves browsers pointing at asset filenames that no longer exist.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: React Router owns the client-side routes, so any path that
  # is not a real file resolves to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
